name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install XcodeGen
        run: |
          curl --fail --location \
            --output "${RUNNER_TEMP}/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  ${RUNNER_TEMP}/xcodegen.zip" \
            | shasum --algorithm 256 --check
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
      - name: Generate project
        run: xcodegen generate
      - name: Test protocol package
        run: swift test
      - name: Test macOS app
        run: >-
          xcodebuild -project VoiceInput.xcodeproj -scheme VoiceInput
          -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned arm64 test app
        run: >-
          xcodebuild -project VoiceInput.xcodeproj -scheme VoiceInput
          -configuration Release -sdk macosx build CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          CONFIGURATION_BUILD_DIR="${RUNNER_TEMP}/VoiceInputBuild"
      - name: Package unsigned arm64 test app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "${RUNNER_TEMP}/VoiceInputBuild/VoiceInput.app"
          "${RUNNER_TEMP}/VoiceInput-macos-arm64-unsigned.zip"
      - name: Upload unsigned arm64 test app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceInput-macos-arm64-unsigned
          path: ${{ runner.temp }}/VoiceInput-macos-arm64-unsigned.zip
          retention-days: 7
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install XcodeGen
        run: |
          curl --fail --location \
            --output "${RUNNER_TEMP}/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          echo "a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82  ${RUNNER_TEMP}/xcodegen.zip" \
            | shasum --algorithm 256 --check
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
      - name: Test iOS app and keyboard extension
        run: make ios-test

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build Android input method
        run: |
          make android-test
          make android-apk
      - name: Upload Android test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceInput-android-debug
          path: dist/VoiceInput-android-debug.apk
          retention-days: 7
          if-no-files-found: error

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.lock
      - name: Install
        run: |
          pip install --requirement server/requirements-dev.lock
          pip install --no-deps --editable server
      - name: Lint
        run: |
          ruff check server/src server/tests scripts/generate_app_icons.py scripts/validate_release_sources.py
          mypy --config-file server/pyproject.toml server/src
      - name: Validate release sources and generated assets
        run: |
          python3 scripts/validate_release_sources.py
          python3 scripts/generate_app_icons.py
          git diff --exit-code -- Resources/Assets.xcassets/AppIcon.appiconset
      - name: Test
        run: pytest server
      - name: Build reference server image
        run: docker build --tag voice-input-server:ci server
      - name: Smoke-test reference server image
        run: |
          docker run --detach --name voice-input-server-ci \
            --env VOICE_INPUT_BEARER_TOKEN=ci-only-token \
            --health-interval 1s --health-start-period 1s \
            --publish 127.0.0.1:18765:8765 voice-input-server:ci
          cleanup() {
            docker rm --force voice-input-server-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          health_status=starting
          for attempt in {1..30}; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' voice-input-server-ci)"
            if test "${health_status}" = healthy; then break; fi
            if test "${health_status}" = unhealthy; then
              docker logs voice-input-server-ci
              exit 1
            fi
            sleep 1
          done
          if test "${health_status}" != healthy; then
            docker logs voice-input-server-ci
            exit 1
          fi
          curl --fail --show-error --retry 3 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:18765/healthz
      - name: Whitespace
        run: git diff --check
