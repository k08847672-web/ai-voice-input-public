name: VoiceInputIOS
options:
  bundleIdPrefix: com.aivoiceinput
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  VoiceInputCore:
    type: framework
    platform: iOS
    sources:
      - ../Sources/VoiceInputCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivoiceinput.ios.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  VoiceInputMobileShared:
    type: framework
    platform: iOS
    sources:
      - ../Sources/VoiceInputMobileShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivoiceinput.ios.mobile-shared
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VoiceInputIOS:
    type: application
    platform: iOS
    sources:
      - ../Sources/VoiceInputiOSApp
      - ../Sources/VoiceInputApp/ASRWireCodec.swift
      - ../Sources/VoiceInputApp/WebSocketASRClient.swift
      - ../Sources/VoiceInputApp/AudioCaptureService.swift
    resources:
      - ../Resources/Assets.xcassets
    dependencies:
      - target: VoiceInputCore
        embed: true
      - target: VoiceInputMobileShared
        embed: true
      - target: VoiceInputKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivoiceinput.ios
        PRODUCT_NAME: VoiceInput
        INFOPLIST_FILE: Resources/VoiceInputIOS-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/VoiceInputIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Reject accidental secrets
        script: |
          if /usr/bin/grep -R -E 'Bearer [A-Za-z0-9_-]{20,}' "${SRCROOT}/../Sources"; then
            echo "error: possible bearer token committed in source"
            exit 1
          fi
        basedOnDependencyAnalysis: false
  VoiceInputKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - ../Sources/VoiceInputKeyboard
    dependencies:
      - target: VoiceInputMobileShared
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivoiceinput.ios.keyboard
        PRODUCT_NAME: VoiceInputKeyboard
        INFOPLIST_FILE: Resources/VoiceInputKeyboard-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/VoiceInputKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VoiceInputMobileSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/VoiceInputMobileSharedTests
    dependencies:
      - target: VoiceInputMobileShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aivoiceinput.ios.mobile-shared-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VoiceInputIOS:
    build:
      targets:
        VoiceInputIOS: all
        VoiceInputMobileSharedTests: [test]
    test:
      targets:
        - VoiceInputMobileSharedTests
    archive:
      config: Release
